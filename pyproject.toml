[project]
name = "klangwerk"
description = "Klangwerk: Sprachdienste je Modell (Sprechen, Stimmklon, Hören, Sprechermerkmal, Sprechertrennung) und der Tondienst, jeder ein eigener Prozess"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# Je Dienst die Modellbibliothek; installieren.sh nimmt alle
mlx = ["mlx>=0.25", "mlx-audio>=0.4", "mlx-whisper>=0.4", "silero-vad>=5"]
torch = ["torch>=2.4", "torchaudio>=2.4", "speechbrain>=1.0", "pyannote-audio>=3.3"]
# Tondienst: Protokoll, Routen und Rechnung aus dem Appkern (immer ein Commit, nie der Zweig)
ton = ["appkern[tondienst] @ https://github.com/HalloWelt42/appkern/archive/3b9249591390be4a871b2a406eeeab25b3c59c97.tar.gz"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
klangwerk = "klangwerk.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider -m \"not echt\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["echt: lädt echte Modelle (nur auf dem Rechner mit den Modellen, gezielt mit -m echt)"]

[tool.setuptools.packages.find]
include = ["klangwerk*"]

[tool.setuptools.package-data]
"klangwerk" = ["VERSION"]

[tool.setuptools.dynamic]
version = {attr = "klangwerk.__version__"}
